name: Deploy Web (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (staging)
        run: pnpm build:staging

      # SSR Worker + static assets (bukan Pages). Nilai env sudah
      # ter-inline saat build dari .env.staging.
      - name: Deploy Worker (staging)
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --name sambasku-web-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
