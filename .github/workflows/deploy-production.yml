name: Deploy Web (Production)

# Deploy murni lewat CI/CD (GitHub Actions → wrangler deploy), BUKAN
# Cloudflare Pages. Web pakai Workers karena SSR (lihat docs/web/web-base-stack.md).
#
# Setup sekali di Cloudflare (manual):
#   1. Worker `sambasku-web-prod` dibuat otomatis oleh deploy pertama.
#   2. Attach custom domain: Workers & Pages → sambasku-web-prod → Settings
#      → Domains & Routes → add `sambasku.com` (+ `www.sambasku.com` redirect).
#   3. API produksi ada di `https://api.sambasku.com/api/v1`
#      (Worker sambasku-api, custom domain). Origin `https://sambasku.com`
#      harus masuk CORS_ALLOWED_ORIGINS api/wrangler.toml [vars].
#
# Secrets repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - izin "Workers Scripts: Edit" (BEDA kebutuhan
#                            dengan admin yang pakai "Cloudflare Pages: Edit";
#                            satu token boleh dua-duanya asal scoped begitu)
#   CLOUDFLARE_ACCOUNT_ID  - Account ID Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Web belum punya script test; react-router build tidak menjalankan
      # tsc, jadi typecheck eksplisit di sini.
      - name: Typecheck
        run: pnpm typecheck

      # `pnpm build` = react-router build (production adalah mode default,
      # tidak perlu --mode). .env.production TIDAK ter-track - nilai build
      # di-inject langsung di sini; Vite memberi process env prioritas
      # tertinggi. Nilai VITE_* memang publik (ter-embed di bundle JS).
      - name: Build (production)
        run: pnpm build
        env:
          VITE_API_BASE_URL: https://api.sambasku.com/api/v1
          # Tier cadangan circuit breaker, urut (docs/backlogs/FAILOVER.md).
          # Menambah host di sini WAJIB diikuti connect-src di public/_headers
          # dan app/worker.ts, atau browser memblokir panggilan ke tier cadangan.
          VITE_API_BASE_URL_FALLBACKS: https://deno.sambasku.com/api/v1,https://render.sambasku.com/api/v1
          VITE_APP_URL: https://sambasku.com
          VITE_APP_NAME: SambasKu

      # --name sambasku-web-prod: Worker produksi terpisah dari staging
      # (sambasku-web-staging) maupun default (sambasku-web).
      - name: Deploy ke Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name sambasku-web-prod

      # Pentest W-01/B-01: CSP yang ter-deploy WAJIB memuat semua host fallback -
      # drift ini pernah mematikan failover circuit breaker di browser.
      # B-01: produksi pernah menjalankan build != main (tanpa x-cache, dengan
      # x-cached-at) - assertion ini gagal bila redeploy ternyata tidak live.
      # Assertion gagal = deploy dianggap gagal.
      - name: Verifikasi header live pasca-deploy
        run: |
          sleep 20  # beri waktu propagasi deploy
          CSP="$(curl -fsSI https://sambasku.com/ | tr -d '\r\n' | grep -i 'content-security-policy:')"
          echo "$CSP"
          if [ -z "$CSP" ]; then echo "::error::Header CSP tidak ditemukan"; exit 1; fi
          for host in https://deno.sambasku.com https://render.sambasku.com; do
            if ! echo "$CSP" | grep -q "$host"; then
              echo "::error::CSP tidak memuat host fallback $host"
              exit 1
            fi
          done
          if echo "$CSP" | grep -q 'unsafe-eval'; then
            echo "::error::CSP produksi masih memuat unsafe-eval"; exit 1
          fi
          if echo "$CSP" | grep -q 'sambasku-staging'; then
            echo "::error::CSP produksi memuat host staging"; exit 1
          fi
          # Forensik deploy (B-01): worker baru selalu menset x-cache + no-cache
          # dan tidak pernah mengirim x-cached-at.
          LIVE_ID_HEADERS="$(curl -fsSI https://sambasku.com/id | tr -d '\r')"
          echo "$LIVE_ID_HEADERS"
          if ! echo "$LIVE_ID_HEADERS" | grep -qi '^x-cache:'; then
            echo "::error::Header x-cache tidak ada di /id - build yang dideploy bukan worker terbaru (B-01)"; exit 1
          fi
          if ! echo "$LIVE_ID_HEADERS" | grep -qi '^cache-control: no-cache'; then
            echo "::error::Cache-Control bukan no-cache di /id - build yang dideploy bukan worker terbaru (B-01)"; exit 1
          fi
          if echo "$LIVE_ID_HEADERS" | grep -qi '^x-cached-at:'; then
            echo "::error::x-cached-at bocor ke klien (W-08)"; exit 1
          fi
