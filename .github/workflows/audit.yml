name: Security Audit

# Pentest B-11: pnpm audit berkala - dependensi bersih hari ini dengan margin
# tipis terhadap advisory react-router 2026; audit dijalankan tiap pakai
# dependensi harus sadar, bukan hanya saat deploy.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependensi produksi
        run: pnpm audit --prod
