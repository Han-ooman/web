# Pentest B-11: situs banyak memakai redirect() di loader - tepat kelas kode
# yang dihantam CVE-2026 react-router. Floor di package.json menahan versi
# bawah, dependabot menarik patch ke atas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
